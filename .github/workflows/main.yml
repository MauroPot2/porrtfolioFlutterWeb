name: Deploy Portfolio

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test static Shavette pages
        working-directory: ./portfolioflutterweb
        run: node --test test/shavette_static_test.js

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ./portfolioflutterweb
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: ./portfolioflutterweb
        run: flutter build web --release --base-href "/"

      - name: Configure GitHub Pages SPA fallback
        working-directory: ./portfolioflutterweb
        run: cp build/web/index.html build/web/404.html

      - name: Deploy GitHub Pages fallback
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./portfolioflutterweb/build/web
          force_orphan: true

      - name: Deploy Firebase Hosting production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_15_V1 }}
          projectId: portfolio-15-v1
          channelId: live
